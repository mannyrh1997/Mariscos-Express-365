<!doctype html>
<html lang="es">
<head>

  <title>Mariscos Express 365 | Productos</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>

      <p class="sub">Selecciona tus productos y agrégalos al carrito. Luego envía tu pedido por WhatsApp.</p>

          <div><h2>🦑 Calamar</h2><p>Precios por libra</p></div>
        </div>

      <section class="section" id="secCamarones">
        <div class="sectionTitle">
          <div><h2>🦐 Camarones</h2><p>Precios por libra</p></div>
        </div>
        <div class="grid" id="gridCamarones"></div>
      </section>

      <section class="section" id="secEspeciales">
        <div class="sectionTitle">
          <div><h2>⭐️ Especiales de la semana</h2><p>Oferta limitada</p></div>
        </div>
        <div class="grid" id="gridEspeciales"></div>
      </section>
    </div>
  </main>

  <script src="assets/app.js"></script>

</html>
